name: Test

on:
  workflow_dispatch:
    inputs:
      school:
        description: "Add your School name"
        required: true
        default: "Chaman lal dav"
      Department:
        description:  "Department"
        type: choice
        default: medical
        required: true
        options:
          - Science
          - commerce
          - medical
      Inermediate:
        type: boolean
        required: true
        default: true
        
           
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      name: 'naman singh negi'
      roll_number: 12345
      class: "Tenth"

    steps:
      - uses: actions/checkout@v3

      - name: Your school name
        run:  echo "Your school name is ${{ inputs.school }} and your Department is ${{ inputs.Department }}, you are in ${{ inputs.Intermediate && '12' || '10' }}"

   
